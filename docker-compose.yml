services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      - DB_SOURCE=postgresql://postgres:123@db:5432/mydatabase?sslmode=disable
      - JWT_SECRET_KEY=my-super-secret-key-for-dev-only
      - API_PORT=8080
    restart: unless-stopped

  migrator:
    image: migrate/migrate
    volumes:
      - ./db/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgresql://postgres:123@db:5432/mydatabase?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
